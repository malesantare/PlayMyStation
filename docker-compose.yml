# Порты доступны только локально; Caddy обращается к app по Docker-сети.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: playmystation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playmystation}
      POSTGRES_DB: playmystation
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  # Go-сайдкар: транспорт для gRPC-стримов нативного протокола
  # Яндекс Музыки (Ynison). Слушает только внутри compose-сети.
  ynison:
    build: ./ynison-proxy
    expose:
      - "50051"

  app:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:8000:8000"

  # Ежедневный pg_dump в 03:00 + ротация (BACKUP_RETENTION_DAYS, default 7).
  # Первый бэкап — сразу при старте (с ретраями, пока встаёт postgres).
  backup:
    image: postgres:16-alpine
    depends_on:
      - postgres
    env_file: .env
    environment:
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./scripts/pg_backup.sh:/scripts/pg_backup.sh:ro
      - pgbackups:/backups
    entrypoint: >
      sh -c 'echo "0 3 * * * sh /scripts/pg_backup.sh >>/var/log/backup.log 2>&1" | crontab -
      && for i in 1 2 3 4 5 6; do sh /scripts/pg_backup.sh >>/var/log/backup.log 2>&1 && break || sleep 10; done
      && exec crond -f -l 2'

volumes:
  pgdata:
  pgbackups:
