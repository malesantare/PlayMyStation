name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    # SQLite create_all не проверяет реальные PostgreSQL-миграции.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: playmystation
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: playmystation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playmystation"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev dependencies
        run: |
          pip install uv==0.12.23
          uv sync --locked --extra dev
      - name: Ruff check
        run: uv run --locked --extra dev ruff check app tests
      - name: Compile check
        run: uv run --locked --extra dev python -m compileall -q app
      - name: PostgreSQL migrations match models
        env:
          BOT_TOKEN: "123456:test"
          DATABASE_URL: "postgresql+asyncpg://playmystation:test-only@localhost:5432/playmystation"
        run: |
          uv run --locked --extra dev alembic upgrade head
          uv run --locked --extra dev alembic check
      - name: Tests
        env:
          BOT_TOKEN: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
          FERNET_KEY: "ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg="
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          SPOTIFY_CLIENT_ID: "test"
          SPOTIFY_CLIENT_SECRET: "test"
          SPOTIFY_REDIRECT_URI: "http://localhost:8000/oauth/spotify/callback"
          WEB_HOST: "0.0.0.0"
          WEB_PORT: "8000"
          PUBLIC_BASE_URL: "http://localhost:8000"
        run: uv run --locked --extra dev python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
